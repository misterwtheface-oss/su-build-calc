<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Siralim Ultimate — Companion</title>
  <meta name="description" content="Theorycraft Siralim Ultimate parties: 6 creature slots, fusion, artifacts, relics, nether stones and realm cards.">
  <link rel="stylesheet" href="styles.css?v=05c41de0">

  <!-- Favicon: desktop Chrome/Firefox tabs need an explicit rel="icon" (they don't fall back to the
       manifest icons the way mobile/installed does). Without this they request /favicon.ico at the
       ORIGIN root, which 404s on a GitHub Pages project site → default globe. Point it at the Riddle Dwarf. -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">

  <!-- Tier 2 PWA: installability (home-screen icon, standalone chrome). -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1024">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Cloudflare Web Analytics (live — shared github.io token) -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js"
          data-cf-beacon='{"token": "b5abb0125b524ee8a96efbe9899114a4"}'></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">
      <h1><span class="tt-name">Siralim Ultimate</span> <span class="tt-sub">Companion</span></h1>
    </div>
    <div class="topbar-actions">
      <button class="tb-btn tb-riddle" data-action="open-riddle" title="Riddle Dwarf — quick trivia lookup (class / ruler / realm)"><img src="assets/icon-192.png" alt="Riddle Dwarf"></button>
      <button class="tb-btn" data-action="open-appendix" title="Search anything by tag — perks, creatures, traits, spells…">Appendix</button>
      <div class="menu-wrap">
        <button class="tb-btn menu-btn" data-action="toggle-menu" title="Menu">Menu <span class="chev">▾</span></button>
        <div class="menu-dropdown hidden" id="main-menu">
          <button class="menu-item" data-action="open-artifacts">Artifacts</button>
          <button class="menu-item" data-action="open-nether">Nether Stones</button>
          <button class="menu-item" data-action="open-spellgems">Spell Gems</button>
          <button class="menu-item" data-action="open-cards">Cards</button>
          <div class="menu-sep"></div>
          <button class="menu-item" data-action="open-builds">Builds</button>
          <button class="menu-item" data-action="open-bio">Import / Export</button>
          <button class="menu-item" data-action="open-synergy">Synergy</button>
          <button class="menu-item" data-action="open-threats">RI/Runes</button>
          <button class="menu-item" data-action="open-macros">Macros</button>
          <div class="menu-sep"></div>
          <button class="menu-item" data-action="open-realms">Realms</button>
          <button class="menu-item" data-action="open-netherhelp">Nether Realm</button>
          <button class="menu-item" data-action="open-shops">Shops</button>
          <button class="menu-item" data-action="open-glossary">Glossary</button>
          <button class="menu-item" data-action="open-projects">Projects</button>
          <div class="menu-sep"></div>
          <div class="menu-section-label">Layout Toggle</div>
          <div class="menu-layout-seg seg" role="tablist" aria-label="Party layout">
            <button class="seg-btn" data-action="home-view" data-view="roster" title="At-a-glance column — sprites + traits">List</button>
            <button class="seg-btn" data-action="home-view" data-view="grid" title="Editable tile grid">Grid</button>
          </div>
        </div>
      </div>
      <button class="tb-btn tb-danger" data-action="clear-party" title="Clear the whole party">Reset</button>
    </div>
  </header>

  <!-- build-first home: the party IS the screen -->
  <main id="app" class="planning-main"><!-- rendered by app.js --></main>

  <!-- two overlay layers: selectors on 100, detail pages stack above on 200 -->
  <div id="overlay-root" class="hidden"></div>
  <div id="detail-overlay-root" class="hidden"></div>

  <script src="data.js?v=f3c35582"></script>
  <script src="effects.js?v=7a5a4d0d"></script>
  <script src="buildio.js?v=1ca8801f"></script>
  <script src="app.js?v=c92b76b2" defer></script>

  <!-- Native-shell bridge: ads + "remove ads" purchase. HARD no-op in a browser
       (first guard returns before touching anything) — only activates inside the
       Capacitor Android app build (see app/). Safe on the live site. -->
  <script src="native-bridge.js?v=443dd2af" defer></script>

  <!-- Tier 1 PWA: service worker for cache correctness. Registered only on https
       (the live github.io deploy), so local/LAN previews are unaffected. Invisible:
       no install prompt. Makes the deployed site self-updating (network-first HTML,
       which fixes the stale-index hard-refresh problem) and offline-capable.
       controllerchange reloads once so a new deploy swaps in seamlessly. -->
  <script>
    if ("serviceWorker" in navigator && location.protocol === "https:") {
      addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
      let reloading = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloading) return;
        reloading = true;
        location.reload();
      });
      // Ask the active SW to background-precache the full sprite set so the app works
      // fully offline (airplane mode), not just for art viewed online. Idempotent —
      // the SW exits early once the current asset-list version is cached.
      navigator.serviceWorker.ready.then((reg) => {
        (reg.active || navigator.serviceWorker.controller)?.postMessage({ type: "precache" });
      });
    }
  </script>

</body>
</html>
