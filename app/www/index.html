<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SU Build Calc</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #1a1024; color: #e8ddf2;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center; padding: 24px;
    }
    .offline { max-width: 20rem; }
    h1 { font-size: 1.3rem; margin: 0 0 .5rem; }
    p { opacity: .8; line-height: 1.5; margin: 0; }
  </style>
</head>
<body>
  <!--
    Fallback shell (Option B). In normal operation the app loads the live site via
    server.url and this file is never shown. It only appears if Capacitor can't reach
    the network AND nothing is cached yet. Capacitor requires webDir to be non-empty.
  -->
  <div class="offline">
    <h1>SU Build Calc</h1>
    <p>Can't reach the calculator right now. Check your connection and reopen the app.</p>
  </div>
</body>
</html>
